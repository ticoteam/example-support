name: support                    # the slug: matches the repository emp-support and the label owner:support
display_name: "Support"
labels: [owner:support]
reads: []                        # other bot repositories this one may clone read-only

# Runtime and model are left to your install (hub registry defaults apply). Override here only if
# this bot needs something different, and keep it in step with the bot's settings on the server:
# runtime: <your runtime>
# model: <your model>
# reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the company leaves until an owner turns this on. Drafts go on
# the task. This bot does not need it on.
outbound_send: false

# Start with no routine. Add a triage pass once a person has read a week of the same work done by hand:
# schedules:
#   - id: weekday-triage
#     title: Weekday triage pass
#     cron: "0 9,14 * * 1-5"
#     timezone: America/Los_Angeles   # set to your own timezone
#     template: playbooks/triage-a-ticket.md
schedules: []

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential arrives
# in, never the value. Declaring access here does not create it.
access:
  - service: mail
    identity: "support@acme.example"   # replace with your support mailbox
    can: [read, draft]                 # never send
    env: MAIL_CREDENTIALS
    note: "reads and drafts on the support mailbox; never files, never sends"
# For a helpdesk instead of mail (read only):
#   - service: helpdesk
#     can: [read]
#     env: HELPDESK_TOKEN
